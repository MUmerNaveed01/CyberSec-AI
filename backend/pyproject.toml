[project]
name = "cybersec-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy==2.0.35",
    "alembic==1.13.3",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "passlib[argon2]==1.7.4",
    "argon2-cffi==23.1.0",
    "python-jose[cryptography]==3.3.0",
    "celery[redis]==5.4.0",
    "redis==5.1.1",
    "structlog==24.4.0",
    "httpx==0.27.2",
    "python-multipart==0.0.12",
    "slowapi==0.1.9",
    "secure==0.3.0",
    "aiofiles==24.1.0",
    "aiosqlite==0.20.0",
    "tenacity==9.0.0",
    "email-validator==2.2.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
    "ruff",
    "black",
    "mypy"
]

[tool.ruff]
line-length = 88
select = ["E","F","I","S","B","A","C4","UP"]

[tool.black]
line-length = 88
target-version = ['py312']

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
