services:
  # Development overrides — mounts source code for hot-reload
  postgres:
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: cybersec
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: cybersecdb_dev

  redis:
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    environment:
      APP_ENV: development
      DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://cybersec:devpassword@postgres:5432/cybersecdb_dev
      ALEMBIC_DATABASE_URL: postgresql://cybersec:devpassword@postgres:5432/cybersecdb_dev
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SECRET_KEY: dev-secret-key-not-for-production-use
      JWT_SECRET_KEY: dev-jwt-secret-not-for-production
      JWT_REFRESH_SECRET_KEY: dev-jwt-refresh-secret-not-for-production
      CORS_ORIGINS: "http://localhost:3000,http://localhost:80"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=debug --queues=scans,default --concurrency=2
    volumes:
      - ./backend:/app
    environment:
      APP_ENV: development
      DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://cybersec:devpassword@postgres:5432/cybersecdb_dev
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SECRET_KEY: dev-secret-key-not-for-production-use
      JWT_SECRET_KEY: dev-jwt-secret-not-for-production
      JWT_REFRESH_SECRET_KEY: dev-jwt-refresh-secret-not-for-production

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
